<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>パブロ🥦🍼 HAPPY BIRTHDAY!</title>
<style>
:root{--ink:#294b38;--green:#3f8058;--green-dark:#285b3d;--green-mid:#8fbd91;--green-pale:#e9f3e7;--paper:#fffef7;--line:#c8dfc4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 12% 12%,#fff 0 6%,transparent 7%),linear-gradient(135deg,#f5faef,#e6f1e3 55%,#f7faef);overflow-x:hidden}
button{font:inherit}
.page{min-height:100svh;display:flex;flex-direction:column;padding:clamp(12px,2.5vw,28px);max-width:1500px;margin:auto}
.topbar{display:flex;align-items:center;justify-content:flex-start;margin:0 0 4px}
.download-btn{border:2px solid #78a77b;background:#fff;color:#326846;border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #c6ddc3}
.download-btn:disabled{opacity:.55;cursor:wait}
header{text-align:center;flex:none}
h1{font-size:clamp(23px,4vw,42px);margin:2px 0 4px;letter-spacing:.04em;color:#326846;text-shadow:1px 2px #fff}
.sub{font-size:clamp(11px,1.5vw,14px);color:#6f9675;margin:0 0 14px}
.mode-switch{display:flex;justify-content:center;gap:8px;margin:0 auto 14px}
.mode-btn{border:2px solid #a9cba7;background:#f8fcf5;color:#47734f;padding:9px 22px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #c9dfc6;transition:.15s}
.mode-btn.active{background:#4f8b60;color:white;border-color:#4f8b60;box-shadow:0 3px 0 #326846}
.mode-btn:focus-visible,.nav-btn:focus-visible,.download-btn:focus-visible{outline:3px solid #285b3d;outline-offset:3px}
main{flex:1;min-height:0}
.single-view{display:flex;align-items:center;justify-content:center;min-height:min(66vh,680px)}
.message-card{width:min(100%,1000px);min-height:min(60vh,600px);display:grid;grid-template-columns:minmax(220px,36%) 1fr;background:var(--paper);border:3px solid #b8d5b4;border-radius:28px;overflow:hidden;box-shadow:0 12px 35px #315c3820}
.avatar-panel{display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#e6f2e3,#f7faef)}
.avatar{
  width:min(100%,280px);
  aspect-ratio:1;
  object-fit:contain;
  border-radius:8px;
  border:0;
}
.message-panel{padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;min-height:0}
.sender{font-size:clamp(20px,3vw,30px);margin:0 0 16px;color:#326846;overflow-wrap:anywhere}
.message{white-space:pre-wrap;overflow-wrap:anywhere;overflow-y:auto;flex:1;min-height:120px;max-height:46vh;padding:4px 10px 4px 0;font-size:clamp(15px,1.8vw,19px);line-height:1.95;scrollbar-color:#a9cba7 transparent}
.page-count{text-align:center;color:#6f9675;font-weight:700;margin-top:12px;font-size:13px}
.nav{display:flex;justify-content:center;align-items:center;gap:16px;margin:12px 0 4px}
.nav-btn{border:0;border-radius:999px;background:#4f8b60;color:#fff;padding:11px 22px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #326846}
.nav-btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;max-width:45vw}
.dot{width:8px;height:8px;border-radius:50%;background:#c8dfc4;border:0;padding:0;cursor:pointer}
.dot.active{background:#39754d;transform:scale(1.35)}
.board-view{display:none}
.board-download-row{display:flex;justify-content:center;margin:8px 0 16px}
.single-view{touch-action:pan-y}
.board{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(130px,auto);gap:13px;padding:clamp(16px,3vw,34px);background:#dcebd6;border:12px solid #a6c99e;border-radius:18px;box-shadow:inset 0 0 0 3px #f4f8ec,0 12px 30px #315c3826;isolation:isolate}
.board:before{content:"";position:absolute;inset:9px;border:2px dashed #a1c59b;border-radius:8px;pointer-events:none;z-index:-1}
.board-column{display:contents}
.board-center{grid-column:3/5;grid-row:2/4;align-self:center;justify-self:center;width:100%;height:100%;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fffef7;border:5px double #8db78b;border-radius:12px;padding:18px 12px;box-shadow:0 6px 16px #315c3820;z-index:1}
.hero-photo{width:min(100%,190px);height:auto;object-fit:contain;border-radius:8px;border:5px solid #e5f0df;box-shadow:0 4px 12px #315c3825}
.center-name{font-size:clamp(17px,2vw,23px);font-weight:900;color:#326846;margin:10px 0 3px}
.center-caption{font-size:12px;color:#6f9675;font-weight:800;letter-spacing:.08em}
.note{position:relative;align-self:stretch;background:#fffef8;border:1px solid #c5d9bd;border-radius:5px;padding:14px 13px 13px;box-shadow:2px 4px 9px #315c381c;overflow-wrap:anywhere;transform:rotate(var(--tilt,0deg))}
.note:nth-child(3n){--tilt:-1deg}.note:nth-child(3n+1){--tilt:1deg}
.note:before{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;background:#75a779;border:2px solid #f6faef;border-radius:50%;transform:translateX(-50%);box-shadow:0 1px 3px #315c3830}
.note-name{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:800;
  color:#39734c;
  margin:0 0 7px;
  font-size:14px;
}

.note-avatar{
  width:27px;
  height:27px;
  flex:0 0 27px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #d8e9d2;
  background:#edf4e9;
}
.note-message{white-space:pre-wrap;line-height:1.65;font-size:13px;margin:0;color:#344d3b}
.board-footer{text-align:center;color:#5e8866;font-size:12px;margin:14px 0}
footer{text-align:center;color:#78977a;font-size:11px;padding:12px 0 0}
.welcome{position:fixed;inset:0;background:#1d3829a8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.welcome-box{background:#f8fcf4;border:4px solid #a9cba7;border-radius:26px;padding:32px 25px;text-align:center;max-width:440px;width:100%;box-shadow:0 18px 50px #14271b55}
.welcome-box h2{font-size:clamp(22px,5vw,30px);color:#326846;margin:0 0 10px}
.welcome-box p{line-height:1.8;margin:0 0 20px}
.welcome-box button{background:#4f8b60;color:white;border:0;border-radius:999px;padding:12px 34px;font-weight:800;cursor:pointer}
@media(max-width:700px){
 .page{padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
 .topbar{margin-bottom:5px}.download-btn{padding:8px 11px;font-size:12px}
 h1{margin-top:3px}
 .mode-switch{margin-bottom:10px}
 .mode-btn{padding:9px 22px;font-size:14px}
 .single-view{min-height:0;display:block}
 .message-card{height:calc(100svh - 235px);min-height:360px;max-height:680px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);border-radius:22px}
 .avatar-panel{padding:12px 10px 8px}
 .avatar{width:min(34vw,150px);border-width:4px}
 .message-panel{padding:12px 18px 18px}
 .sender{text-align:center;font-size:21px;margin:0 0 8px}
 .message{font-size:15px;line-height:1.8;max-height:100%;min-height:0}
 .page-count{margin-top:8px}
 .nav{gap:12px;margin-top:9px}
 .nav-btn{padding:12px 18px}
 .dots{max-width:38vw}
 .board{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(110px,auto);gap:10px;padding:14px;border-width:8px}
 .board-center{grid-column:1/-1;grid-row:auto;min-height:0;padding:15px;order:-1}
 .hero-photo{width:min(34vw,140px);border-width:5px}
 .note{padding:12px 11px}
 .note-name{font-size:13px}.note-message{font-size:12px;line-height:1.6}
}
@media(min-width:701px) and (max-height:760px){.single-view{min-height:0}.message-card{min-height:480px}.message{max-height:40vh}}
@media print{.topbar,.mode-switch,.nav,.page-count,footer{display:none!important}.board-view{display:block!important}.board{break-inside:avoid}}
.welcome-box{animation:popIn .6s cubic-bezier(.2,1.5,.5,1) both;overflow:hidden;padding:22px 22px 16px}
.welcome-photo{display:block;width:min(100%,220px);height:220px;object-fit:cover;object-position:center top;margin:0 auto 12px;border-radius:20px;background:#fff}
.welcome-box h2{font-size:clamp(24px,6vw,32px);margin-bottom:4px}
.welcome-date{font-size:clamp(20px,5vw,26px);font-weight:800;color:#326846;margin:0!important}
.welcome-cheer{font-size:clamp(24px,6vw,34px);font-weight:900;color:#f39b35;margin:4px 0 0!important}
.welcome.fade-out{opacity:0;transition:opacity .65s ease;pointer-events:none}
@keyframes popIn{from{opacity:0;transform:scale(.6) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.bgm-controls{position:fixed;right:14px;bottom:14px;z-index:9;display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f7fff7;border:1px solid #a6c6ad;border-radius:18px;box-shadow:0 4px 18px #16382144;color:#285c38;max-width:calc(100vw - 28px);box-sizing:border-box}
.bgm-toggle{border:0;border-radius:999px;padding:9px 13px;background:#3d7850;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.bgm-volume-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;white-space:nowrap}
.bgm-volume{width:95px;accent-color:#3d7850;cursor:pointer}
@media(max-width:420px){.bgm-controls{gap:7px;padding:7px 9px}.bgm-toggle{padding:8px 10px;font-size:12px}.bgm-volume{width:65px}}

 .person-jump{display:flex;align-items:center;justify-content:center;gap:9px;margin:12px auto 4px;color:#326846;font-weight:700;font-size:14px}
.person-jump select{max-width:min(72vw,320px);padding:9px 13px;border:1px solid #a6c6ad;border-radius:12px;background:#fffef7;color:#285c38;font-size:14px;cursor:pointer}
/* 投稿画像の拡大表示 */
.avatar:not(.avatar-missing),.note-avatar:not(.avatar-missing){cursor:zoom-in}
.image-lightbox{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:55px 16px 24px;box-sizing:border-box}
.image-lightbox.is-open{display:flex}
.image-lightbox img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px}
.lightbox-close{position:absolute;right:14px;top:12px;border:0;border-radius:50%;width:42px;height:42px;background:rgba(255,255,255,.2);color:white;font-size:29px;line-height:1;cursor:pointer}
/* ホーム画面 */
.message-card.is-home{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f5fbef,#fffdf4);text-align:center;padding:28px;box-sizing:border-box}
.message-card.is-home .avatar-panel{display:none}
.message-card.is-home .message-panel{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;box-sizing:border-box}
.message-card.is-home .sender{font-size:clamp(25px,5vw,44px);line-height:1.4;margin:0}
.message-card.is-home .message{font-size:clamp(15px,2.6vw,19px);line-height:2;text-align:center;white-space:pre-line;overflow:visible;max-height:none}
.message-card.is-home .home-start{border:0;border-radius:999px;background:#4f8b60;color:white;font-weight:800;font-size:16px;padding:13px 26px;cursor:pointer}
@media(max-width:700px){.message-card.is-home .message-panel{padding:14px}.message-card.is-home{min-height:360px}}
.music-question{font-size:16px;font-weight:800;color:#326846;margin:12px 0 8px!important}
.music-choice{display:flex;gap:10px;justify-content:center;margin:0 0 14px}
.music-choice button{padding:10px 24px;background:#4f8b60}
.music-choice button.selected{background:#285c38;outline:3px solid #c3e6b5;outline-offset:2px}
.music-choice #musicMute{background:#7c8b7e}
.music-choice #musicMute.selected{background:#4a5c4d}
</style>
</head>
<body>

<audio id="bgm" src="bgm.MP3" loop preload="auto"></audio>

<div class="page">

<header>
 <h1>パブロ🥦🍼 HAPPY BIRTHDAY!</h1>
 <p class="sub">みんなからのお祝いメッセージ</p>
 <div class="mode-switch" role="group" aria-label="表示モード">
  <button class="mode-btn active" id="singleMode" type="button">メッセージ</button>
  <button class="mode-btn" id="boardMode" type="button">寄せ書き</button>
 </div>
</header>
<main>
 <section class="single-view" id="singleView" aria-label="メッセージ">
  <article class="message-card">
   <div class="avatar-panel"><img class="avatar" id="avatar" alt="投稿者のアバター"></div>
   <div class="message-panel">
    <h2 class="sender" id="sender"></h2>
    <div class="message" id="message"></div>
   </div>
  </article>
 </section>
 <div class="page-count" id="pageCount"></div>
 <div class="person-jump"><label for="personSelect">投稿者を選択：</label><select id="personSelect" aria-label="投稿者を選択"></select></div>
 <nav class="nav" id="navigation" aria-label="メッセージ切り替え">
  <button class="nav-btn" id="prev" type="button">← 前へ</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="next" type="button">次へ →</button>
 </nav>
 <section class="board-view" id="boardView" aria-label="寄せ書き">
  <div class="board-download-row"><button class="download-btn" id="downloadBoard" type="button">寄せ書き画像をダウンロード</button></div>
  <div class="board" id="board"></div>
  <p class="board-footer">みんなからのメッセージをひとつに集めました</p>
 </section>
</main>
<footer>With love, from everyone.</footer>
</div>

<script>
 // BGM操作。ブラウザが許可する場合はページ表示時に自動再生する。
const bgm = document.getElementById("bgm");
const bgmToggle = document.getElementById("bgmToggle");
const bgmVolume = document.getElementById("bgmVolume");
const bgmVolumeValue = document.getElementById("bgmVolumeValue");
let bgmManuallyStopped = false;

function syncBgmButton() {
  bgmToggle.textContent = bgm.paused ? "♪ BGMを再生" : "♪ BGMを停止";
  bgmToggle.setAttribute("aria-pressed", String(!bgm.paused));
}
function updateBgmVolume() {
  bgm.volume = Number(bgmVolume.value) / 100;
  bgmVolumeValue.textContent = bgmVolume.value + "%";
}
function playBgm() {
  if (bgmManuallyStopped) return;
  const playResult = bgm.play();
  if (playResult && typeof playResult.catch === "function") {
    playResult.catch(() => { syncBgmButton(); });
  }
}
bgmVolume.addEventListener("input", updateBgmVolume);
bgm.addEventListener("play", syncBgmButton);
bgm.addEventListener("pause", syncBgmButton);
bgmToggle.addEventListener("click", () => {
  if (bgm.paused) {
    bgmManuallyStopped = false;
    playBgm();
  } else {
    bgmManuallyStopped = true;
    bgm.pause();
  }
});
updateBgmVolume();
syncBgmButton();
// 初期状態は無音。明示的に「再生」を選択した場合のみ再生する。
bgmManuallyStopped = true;
const musicPlayButton = document.getElementById("musicPlay");
const musicMuteButton = document.getElementById("musicMute");
musicPlayButton.addEventListener("click", () => {
  bgmManuallyStopped = false;
  musicPlayButton.classList.add("selected");
  musicMuteButton.classList.remove("selected");
  playBgm();
});
musicMuteButton.addEventListener("click", () => {
  bgmManuallyStopped = true;
  bgm.pause();
  musicMuteButton.classList.add("selected");
  musicPlayButton.classList.remove("selected");
});
// ポップアップが閉じても未選択なら無音のまま。
function closeWelcome() {
  const welcome = document.getElementById("welcome");
  if (!welcome || welcome.classList.contains("fade-out")) return;
  welcome.classList.add("fade-out");
  setTimeout(() => welcome.remove(), 700);
}
document.getElementById("start").addEventListener("click", () => {
  closeWelcome();
  renderSingle();

let currentIndex = -1;
let currentMode = "single";
const $ = id => document.getElementById(id);
function setAvatar(img, filename){
 img.onerror = () => { img.removeAttribute("src"); img.alt = "アバター画像を表示できません"; img.classList.add("avatar-missing"); };
 img.classList.remove("avatar-missing");
 if (filename) { img.src = "images/" + encodeURIComponent(filename); }
 else { img.removeAttribute("src"); img.alt = "アバター画像なし"; }
}
function renderSingle(){
 const home=currentIndex===-1;
 const card=document.querySelector(".message-card");
 card.classList.toggle("is-home",home);
 if ($("personSelect")) $("personSelect").value=String(currentIndex);
 $("dots").replaceChildren();
 if(home){
   $("sender").textContent="パブロ🥦🍼 HAPPY BIRTHDAY!";
   $("message").textContent="みんなから届いた、お祝いのメッセージを集めました。\n左右にスワイプ・『次へ』、名前を選ぶを押して見てね！";
   $("avatar").removeAttribute("src");
   $("pageCount").textContent="HOME / "+messages.length+"人のメッセージ";
   const start=document.createElement("button");
   start.type="button";start.className="home-start";
   start.textContent="メッセージを見る →";
   start.onclick=()=>{currentIndex=0;renderSingle()};
   $("message").append(document.createElement("br"),start);
 }else{
   const item=messages[currentIndex];
   if(!item)return;
   $("sender").textContent=item.name;
   $("message").textContent=item.message;
   setAvatar($("avatar"),item.avatarFile);
   $("pageCount").textContent=`${currentIndex+1} / ${messages.length}`;
 }
 const pages=[-1,...messages.map((_,i)=>i)];
 pages.forEach(i=>{
   const dot=document.createElement("button");
   dot.className="dot"+(i===currentIndex?" active":"");
   dot.type="button";
   dot.setAttribute("aria-label",i===-1?"ホーム":`${i+1}ページ目`);
   dot.onclick=()=>{currentIndex=i;renderSingle()};
   $("dots").append(dot);
 });
 $("prev").disabled=false;
 $("next").disabled=false;
}

function makeNote(item){
  const article=document.createElement("article");
  article.className="note";

  const name=document.createElement("h3");
  name.className="note-name";

  // 投稿者の丸アイコン
  const avatar=document.createElement("img");
  avatar.className="note-avatar";
  avatar.alt="";
  setAvatar(avatar,item.avatarFile);

  // 投稿者名
  const nameText=document.createElement("span");
  nameText.textContent=item.name;

  name.append(avatar,nameText);

  // メッセージ
  const msg=document.createElement("p");
  msg.className="note-message";
  msg.textContent=item.message;

  article.append(name,msg);

  return article;
}
function renderBoard(){
 const board=$("board");board.replaceChildren();
 const center=document.createElement("div");center.className="board-center";
 const photo=document.createElement("img");photo.className="hero-photo";photo.src=birthdayPhoto;photo.alt="誕生日のパブロさん";
 const name=document.createElement("div");name.className="center-name";name.textContent="パブロ🥦🍼";
 const caption=document.createElement("div");caption.className="center-caption";caption.textContent="HAPPY BIRTHDAY!";
 center.append(photo,name,caption);
 // 色紙の上にメッセージカードを散りばめ、中央の本人を囲む
 messages.forEach(item=>board.append(makeNote(item)));
 board.append(center);
}
function switchMode(mode){
 currentMode=mode;
 const single=mode==="single";
 $("singleView").style.display=single?"flex":"none";
 $("pageCount").style.display=single?"block":"none";
 $("navigation").style.display=single?"flex":"none";
 document.querySelector(".person-jump").style.display=single?"flex":"none";
 $("boardView").style.display=single?"none":"block";
 $("singleMode").classList.toggle("active",single);
 $("boardMode").classList.toggle("active",!single);
 if(single) renderSingle();
 else renderBoard();
}
function move(delta){currentIndex=((currentIndex+1+delta+messages.length+1)%(messages.length+1))-1;renderSingle()}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("singleMode").onclick=()=>switchMode("single");
$("boardMode").onclick=()=>switchMode("board");
setTimeout(() => {
  closeWelcome();
  renderSingle();
}, 5000);
let imageCaptureLoading=null;
function loadImageCaptureLibrary(){
 if(window.html2canvas)return Promise.resolve();
 if(imageCaptureLoading)return imageCaptureLoading;
 const urls=[
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
  "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"
 ];
 imageCaptureLoading=(async()=>{
  for(const url of urls){
   try{
    await new Promise((resolve,reject)=>{
     const script=document.createElement("script");
     script.src=url;script.async=true;
     script.onload=resolve;script.onerror=()=>{script.remove();reject(new Error("読み込み失敗: "+url));};
     document.head.append(script);
    });
    if(window.html2canvas)return;
   }catch(error){console.warn(error);}
  }
  throw new Error("画像保存ライブラリの読み込みに失敗");
 })().catch(error=>{imageCaptureLoading=null;throw error;});
 return imageCaptureLoading;
}
async function downloadRenderedImage(mode, button){
 const actualTarget=mode==="single"?document.querySelector(".message-card"):$('board');
 if(!window.html2canvas){
  try { await loadImageCaptureLibrary(); }
  catch(error){ console.error(error); alert("画像保存機能を読み込めませんでした。通信環境を確認して再度お試しください。"); return; }
 }
 const originalText=button.textContent;
 button.disabled=true;button.textContent="画像を作成中…";
 try{
  await document.fonts.ready;
  const images=Array.from(actualTarget.querySelectorAll("img"));
  await Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener("load",resolve,{once:true});img.addEventListener("error",resolve,{once:true});setTimeout(resolve,4000)})));
  const canvas=await html2canvas(actualTarget,{backgroundColor:mode==="single"?"#fffef7":"#dcebd6",scale:2,useCORS:true,allowTaint:false,logging:false,windowWidth:Math.max(document.documentElement.clientWidth,actualTarget.scrollWidth),windowHeight:Math.max(document.documentElement.clientHeight,actualTarget.scrollHeight)});
  const link=document.createElement("a");
  link.download=mode==="single"?"パブロ誕生日メッセージ.png":"パブロ誕生日寄せ書き.png";
  link.href=canvas.toDataURL("image/png");link.click();
 }catch(error){console.error(error);alert("画像を作成できませんでした。時間をおいて再度お試しください。");}
 finally{button.disabled=false;button.textContent=originalText;}
}

$("downloadBoard").onclick=()=>downloadRenderedImage("board",$("downloadBoard"));
document.addEventListener("keydown",e=>{if(currentMode==="single"&&$("welcome").style.display==="none"){if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)}});
let touchStartX=0;
let touchStartY=0;
$("singleView").addEventListener("touchstart",e=>{
 if(e.touches.length!==1)return;
 touchStartX=e.changedTouches[0].clientX;
 touchStartY=e.changedTouches[0].clientY;
},{passive:true});
$("singleView").addEventListener("touchend",e=>{
 if(currentMode!=="single"||e.changedTouches.length!==1)return;
 if(e.target.closest("button,select,input,a"))return;
 const dx=e.changedTouches[0].clientX-touchStartX;
 const dy=e.changedTouches[0].clientY-touchStartY;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1);
},{passive:true});
// 投稿者名を選ぶと該当するメッセージへ移動
const personSelect=$("personSelect");
const homeOption=document.createElement("option");
homeOption.value="-1";homeOption.textContent="ホーム";
personSelect.append(homeOption);
messages.forEach((item,index)=>{

 option.value=String(index);
 option.textContent=item.name;

personSelect.addEventListener("change",()=>{
 currentIndex=Number(personSelect.value);
 renderSingle();
});

// メッセージ・寄せ書きの投稿画像をタップして拡大
const imageLightbox=document.getElementById("imageLightbox");
const lightboxImage=document.getElementById("lightboxImage");
function closeImageLightbox(){
 imageLightbox.classList.remove("is-open");
 imageLightbox.setAttribute("aria-hidden","true");
 lightboxImage.removeAttribute("src");
 document.body.style.overflow="";
}
document.addEventListener("click",event=>{
 const clickedImage=event.target.closest("img.avatar, img.note-avatar");
 if(clickedImage && clickedImage.getAttribute("src") && !clickedImage.classList.contains("avatar-missing")){
  lightboxImage.src=clickedImage.src;
  lightboxImage.alt=clickedImage.alt || "投稿画像";
  imageLightbox.classList.add("is-open");
  imageLightbox.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
 }
});
document.getElementById("lightboxClose").addEventListener("click",closeImageLightbox);
imageLightbox.addEventListener("click",event=>{if(event.target===imageLightbox)closeImageLightbox()});
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeImageLightbox()});
